# Keyless batch and foreground-child run through the real Loader and tools.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.sessions
    compression: none
- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
- id: backlinks
  name: '@deepseek-ai/dsh-backlinks'
- id: batch-fixture
  name: './tests/fixtures/batch-provider.ts'
- id: tool-backlinks
  name: '@deepseek-ai/dsh-tool-backlinks'
  config:
    maxBatchItems: 3
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
- id: spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
    workBudget:
      maxTokens: 50
      maxSteps: 40
      maxElapsedMs: 600000
      maxRepeatedToolFailures: 3
- id: delegate
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    backgroundMode: one-shot
    enableRunInBackground: false
    toolFilter:
      allow: [backlinks]
    maxDepth: 1
