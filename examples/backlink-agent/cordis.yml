# Backlink publishing agent overlay: mount the browser/backlinks capability
# plugins over any dsh profile (web or headless) and route the model through an
# OpenAI-compatible gateway. Launch from the harness repo root:
#   dsh web --patch examples/backlink-agent/cordis.yml
#   dsh --profile headless --patch examples/backlink-agent/cordis.yml "发布批次 176"
# Secrets resolve from the root `.env` the app bin loads: NEWAPI_API_KEY,
# SUPERMANAGER_TOKEN, and CLOUDMAIL_TOKEN. Paths resolve against the process
# cwd (the repo root for every documented launch command).

# ── overrides of rows the base bundle already mounts ────────────────────────

# The bases ship llm-deepseek; this deployment runs on the gateway below.
- id: llm-deepseek
  disabled: true

# Entry points that create agents without an explicit route (session titles,
# fresh drivers) follow this default; point it at the gateway too.
- id: agent-default-model
  config:
    provider: newapi
    model: grok-4.6

# One OpenAI-compatible route: any New API / One API style aggregator. The
# providers dict key IS the route name.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      newapi:
        apiKeyEnv: NEWAPI_API_KEY
        api: openai-completions
        baseURL: https://newapi.code0.vip/v1
        models:
          - id: gemini-3.7-flash-high
          - id: grok-4.6
          - id: gpt-5.6-sol
          - id: gpt-5.6-terra
          - id: gpt-5.6-luna

# The publisher owns native child scheduling; parent tools cannot start competing groups.
- &backlink-disable-fork
  id: tool-subagent-fork
  disabled: true

- &backlink-disable-spawn
  id: tool-subagent
  disabled: true

- id: subagent-spawn-in-process
  config:
    providerName: spawn
    workBudget:
      maxTokens: 600000
      maxSteps: 40
      maxElapsedMs: 600000
      maxRepeatedToolFailures: 3

- &backlink-compaction
  id: compaction-basic
  config:
    thresholdRatio: 0.2
    retainTokens: 6000
    maxTokens: 2048

# Web sessions mount their preset after the host overlay has loaded.
- id: agent-presets
  config:
    default: standard
    overrides:
      standard: &backlink-preset-overrides
        - *backlink-disable-fork
        - *backlink-disable-spawn
        - *backlink-compaction
        - id: persona
          config:
            text: &backlink-parent-persona |
              You are backlink-agent, a backlink publishing operator powered by the {{model}} model.
              Use backlink-publish for batch requests. Confirm the batch, scope and mode, establish the Goal,
              then call backlink_publish once. The runtime owns claims, rolling workers, page cleanup and leases.
              Use recorded backend results for summaries; submitted means pending review, not publicly live.
              Resolve stoppedReason before continuing. Skip unresolvedItemIds without resubmission; when remaining is zero and stoppedReason is null, complete the Goal and list those items for manual review.
        - id: agent-instructions
          disabled: true
        - id: skill-filesystem
          disabled: true
        - id: tool-fs
          disabled: true
        - id: tool-fs-search
          disabled: true
        - id: tool-jobs
          disabled: true
        - id: tool-subagent-control
          disabled: true
        - id: tool-subagent-list-agents
          disabled: true
        - id: tool-workflow
          disabled: true
        - id: tool-ralph
          disabled: true
      code: *backlink-preset-overrides
      cordis: *backlink-preset-overrides

# ── new plugin rows ─────────────────────────────────────────────────────────

- insert:
    # The backlink operator spine: persona, one pre-created agent, and a skill
    # provider that mounts ONLY the playbooks in this example's skills/ dir.
    # Registering with a distinct provider name merges it into every session
    # catalog, including the web app's preset sessions.
    - id: agent-spine
      name: '@deepseek-ai/dsh-agent-spine-demo'
      config:
        agents:
          - id: main
            provider: newapi
            model: grok-4.6
            cwd: !!js process.cwd()
        workspaceContext: false
        persona: *backlink-parent-persona
        skills:
          filesystem:
            providerName: backlink-operator
            includeDefaultRoots: false
            customSkillDirs:
              - ./examples/backlink-agent/skills

    # Browser automation: one shared persistent Chrome (headed by default so a
    # human can step in for CAPTCHAs and first logins in the same profile).
    - id: browser
      name: '@deepseek-ai/dsh-browser'
      config:
        provider: playwright
    - id: browser-playwright
      name: '@deepseek-ai/dsh-browser-playwright'
      config:
        userDataDir: ./.backlink-browser-profile
        headless: false
        channel: chrome
        # Element and snapshot waits are shorter than navigation waits.
        defaultTimeoutMs: 8000
        navigationTimeoutMs: 20000
        navigationWaitUntil: domcontentloaded
        maxOpenPages: 0
        # The operator controls window visibility; publication never surfaces
        # a window for CAPTCHA or login. Manual-required pages stay available.
        windowPosition: -32000,-32000
        # Google account login rejects Playwright's default --enable-automation
        # flag ("This browser or app may not be secure"); omit it and mask the
        # webdriver blink feature so the seeded Google session can log in.
        ignoreDefaultArgs:
          - --enable-automation
        launchArgs:
          - --disable-blink-features=AutomationControlled
          - --restore-last-session
    - id: tool-browser
      name: '@deepseek-ai/dsh-tool-browser'
      config:
        timeoutMs: 180000
        maxOutputChars: 12000

    # Read-only Remote face the Web publish console renders from.
    - id: backlinks-console
      name: '@deepseek-ai/dsh-backlinks-console'

    # Batch work source and verification mailboxes over the backend's open API.
    - id: backlinks
      name: '@deepseek-ai/dsh-backlinks'
    - id: backlinks-supermanager
      name: '@deepseek-ai/dsh-backlinks-supermanager'
      config:
        # Same composition on every machine: point SUPERMANAGER_BASE_URL at the
        # production backend (https://…) or fall back to a local dev instance.
        baseUrl: !!js process.env.SUPERMANAGER_BASE_URL ?? 'http://127.0.0.1:3000'
    - id: backlinks-cloud-mail
      name: '@deepseek-ai/dsh-backlinks-cloud-mail'
      config:
        baseUrl: https://mail.screwdom.org/api
    - id: tool-backlinks
      name: '@deepseek-ai/dsh-tool-backlinks'
      config:
        timeoutMs: 300000
        maxBatchItems: 3
        maxBatchViewBytes: 16384
        leaseHeartbeatMs: 60000
        publisher:
          provider: spawn
          concurrency: 3
          maxTokens: 2048
          persona: |
            Publish exactly the one assigned backlink item. The prompt supplies item, website, anchors,
            mode, leaseId and page. The runtime owns claims, lease renewal, scheduling and final cleanup.
            Use only browser and backlinks. Required local upload files must be prepared before publication.
            Never inspect Harness source, search the repository, create subagents, or load skill files.
            Every browser command is bound to your reserved page. Omit page or use the assigned ref;
            never open another page. On every click/press set submission=false for navigation/account work,
            or submission=true for the one final publication. After that final action, verify without
            further input. Never repeat a publication, including after a timeout or unknown result.
            BROWSER_ACTION_UNCERTAIN requires failed + manual_required; preserve the page for a human.
            Inspect published status before acting: submitted/live or an existing publishedUrl means done.
            A visible anchor with the target href already on the site means skipped, never another submission.
            Prefer submitUrl to sourceUrl. Inspect aria first, then a scoped snapshot format=form for
            input attributes. Fill known fields together with fields:[{selector,value}]; inspect before submitting.
            The website submission pack owns names, URLs and features; absent explicit anchors use its saved name and URL. Reuse descriptions and images when
            supplied, fetch only missing assets. Choose an assigned active anchor; do not invent destinations.
            In smart mode use directory, blog-comment, forum, article, game or tool-site playbooks; skip an
            unrecognized type. In all mode try the generic registration/submission flow for unknown types too.
            Before claiming no comment area, waitFor selector=":is(#comments,#respond,[id*='comment' i],iframe):visible >> nth=0"
            with timeoutMs=3000. If absent, press End, inspect, open Load comments controls, enter shown
            iframes with frame() selectors, and try URL#comments. Stop probing once an entry is found.
            Only after those probes fail may you skip with 评论区延迟加载探测后仍不存在.
            Prefer a Website field for the link. Rich text/contenteditable requires a toolbar-created link;
            literal HTML there is escaped. Only plain-text HTML comment fields accept an anchor tag;
            BBCode uses [url=targetUrl]anchorText[/url]. Use one link naturally within the comment.
            Verify with snapshot format=links: a visible anchor must have the real target href. Bare URLs,
            escaped HTML and matching link names alone do not establish a backlink. Escaped submissions
            are failed + manual_required, never submitted again.
            A login wall with email signup is a normal registration flow: mailbox_create needs localPart
            and domain=screwdom.org, then mail_wait gets a verification code/link. Return to publish after
            registration. CAPTCHA, rejected registration, or Google-only login without a seeded session
            requires manual_required with the reason and assigned browserId/page. Preserve that page and
            notify the user; never call bringToFront, activate or restore a window, or move it between desktops.
            Use only browser page actions for clicks, keyboard input and screenshots; never use system mouse,
            keyboard, window-control tools or shell commands. The operator opens or minimizes Chrome manually.
            Never request credentials or bypass verification.
            If a reciprocal badge is mandatory, badge_add uses the assigned websiteId. Trigger the configured
            site refresh callback and confirm the badge in the public homepage before submitting.
            Report item_result immediately with the assigned itemId and leaseId. live requires a declared final submission and publicUrl on the assigned source or submission host, excluding the promoted host, plus
            anchorText, targetUrl, one-line evidence, and the assigned page at that public URL with a visible
            matching href. submitted requires an exact visible acknowledgement in receipt plus anchorText,
            targetUrl and evidence; it means pending review. Use verificationSelector to narrow a long page.
            Unknown submission results require failed + manual_required. retryable applies only before a
            final publication and without uncertain input. Paid-only, closed or ineligible sites are skipped.
            After a saved result, do not enter input or navigate again. source_tags uses the assigned sourceId and observed string tags: 免徽章,
            要徽章, 可复用, 有盾, 付费. A tag failure never undoes the saved result or justifies resubmission.
            Preserve manual/unknown pages; the runtime closes conclusive pages after you stop.
            Return only itemId, status, public URL if any, and one sentence of evidence.
