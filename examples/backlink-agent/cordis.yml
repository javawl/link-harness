# Backlink publishing agent overlay: mount the browser/backlinks capability
# plugins over any dsh profile (web or headless) and pin the deployment
# persona. Launch from the harness repo root:
#   dsh web --patch examples/backlink-agent/cordis.yml
#   dsh --profile headless --patch examples/backlink-agent/cordis.yml "发布批次 176"
# Settings-page-managed config (model catalog, default route, main agent)
# lives in profile-settings.yml, installed into the profile's
# cordis.patch.yml by ensure-profile-settings.mjs — a `--patch` overlay
# outranks that layer and hides from the settings editor, so it must not
# carry them. Secrets resolve from the root `.env` the app bin loads:
# NEWAPI_API_KEY, SUPERMANAGER_TOKEN, and CLOUDMAIL_TOKEN. Paths resolve
# against the process cwd (the repo root for every documented launch
# command).

# ── overrides of rows the base bundle already mounts ────────────────────────

# The bases ship llm-deepseek; this deployment runs on the gateway instead
# (the gateway route itself is pinned in profile-settings.yml).
- id: llm-deepseek
  disabled: true

# ── overrides of the base spine rows (agent-spine-demo is retired upstream;
#    the overlay now patches the owning rows directly) ────────────────────────

# The deployment persona, before first-party guidance. The main agent itself
# (provider/model/cwd) is pinned in profile-settings.yml for the same
# settings-editor-visibility reason as the model catalog.
- id: system-prompt
  config:
    personaPrefix: |
      You are backlink-agent, an autonomous backlink publishing operator powered by the {{model}} model.
      You run publish batches from the backlink management backend: pick a batch, drive the target
      sites in the shared browser, verify by reading back public pages, and report every item honestly.
      Any 发外链/发布批次/批次 request goes through the backlink-publish skill; follow it exactly.

- id: agent-instructions
  disabled: true

# ── new plugin rows ─────────────────────────────────────────────────────────

- insert:
    # A second skill provider that mounts ONLY the playbooks in this example's
    # skills/ dir. Registering with a distinct provider name merges it into
    # every session catalog, including the web app's preset sessions.
    - id: skill-filesystem-backlink
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: backlink-operator
        includeDefaultRoots: false
        customSkillDirs:
          - ./examples/backlink-agent/skills

    # Browser automation: one shared persistent Chrome (headed by default so a
    # human can step in for CAPTCHAs and first logins in the same profile).
    - id: browser
      name: '@deepseek-ai/dsh-browser'
    - id: browser-playwright
      name: '@deepseek-ai/dsh-browser-playwright'
      config:
        userDataDir: ./.backlink-browser-profile
        headless: false
        channel: chrome
        # Fail fast on wrong-selector guesses; the agent retries with the
        # next candidate instead of burning the full 20s per miss.
        defaultTimeoutMs: 8000
        # Silent run: render the headed window offscreen so publishing never
        # covers the operator's desktop. The agent calls bringToFront when a
        # human must step in (CAPTCHA, login).
        windowPosition: -32000,-32000
        # Google account login rejects Playwright's default --enable-automation
        # flag ("This browser or app may not be secure"); omit it and mask the
        # webdriver blink feature so the seeded Google session can log in.
        ignoreDefaultArgs:
          - --enable-automation
        launchArgs:
          - --disable-blink-features=AutomationControlled
    - id: tool-browser
      name: '@deepseek-ai/dsh-tool-browser'
      config:
        timeoutMs: 180000
        maxOutputChars: 60000

    # Read-only Remote face the Web publish console renders from.
    - id: backlinks-console
      name: '@deepseek-ai/dsh-backlinks-console'

    # Batch work source and verification mailboxes over the backend's open API.
    - id: backlinks
      name: '@deepseek-ai/dsh-backlinks'
    - id: backlinks-supermanager
      name: '@deepseek-ai/dsh-backlinks-supermanager'
      config:
        # Same composition on every machine: point SUPERMANAGER_BASE_URL at the
        # production backend (https://…) or fall back to a local dev instance.
        baseUrl: !!js process.env.SUPERMANAGER_BASE_URL ?? 'http://127.0.0.1:3000'
    - id: backlinks-cloud-mail
      name: '@deepseek-ai/dsh-backlinks-cloud-mail'
      config:
        baseUrl: https://mail.screwdom.org/api
    - id: tool-backlinks
      name: '@deepseek-ai/dsh-tool-backlinks'
      config:
        timeoutMs: 300000
