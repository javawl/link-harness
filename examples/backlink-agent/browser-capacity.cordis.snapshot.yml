- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  config:
    path: ./.browser-settings.yaml
    watch: false
- id: browser
  name: '@deepseek-ai/dsh-browser'
  config:
    provider: playwright
- id: browser-playwright
  name: '@deepseek-ai/dsh-browser-playwright'
  config:
    userDataDir: ./.browser-capacity-profile
    headless: true
    channel: chrome
    defaultTimeoutMs: 5000
    navigationTimeoutMs: 10000
    navigationWaitUntil: domcontentloaded
    maxOpenPages: !!js Number(process.env.DSH_CAPACITY_LIMIT ?? 2)
    profiles:
      - id: isolated
        userDataDir: ./.browser-isolated-profile
      - id: attached
        cdpEndpoint: !!js process.env.DSH_CDP_ENDPOINT
